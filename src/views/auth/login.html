<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - MiaWoof Petshop</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card" style="border-top: 5px solid var(--accent-yellow) !important;">
            <!-- Brand Logo -->
            <div class="text-center mb-4">
                <a href="/" class="brand-wrapper mb-3" style="text-decoration: none; display: inline-flex;">
                    <img src="/images/branding/logo.jpg" alt="MiaWoof Petshop Logo" width="38" height="38" class="rounded-1 border border-1 border-dark" onerror="this.src='/images/icons/paw.svg'">
                    <span class="brand-title fs-3 text-dark">MiaWoof Petshop</span>
                </a>
                <div>
                    <span class="badge-accent-yellow mb-2">Portal Akses Masuk</span>
                </div>
                <h4 class="fw-bold text-dark mb-1">Selamat Datang Kembali</h4>
                <p class="text-muted small mb-0">Masuk ke akun Anda untuk belanja & booking grooming.</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label-custom">Username</label>
                    <input type="text" id="username" class="form-control form-control-custom" placeholder="Masukkan username Anda" required autofocus>
                </div>

                <div class="mb-4">
                    <label class="form-label-custom">Password</label>
                    <input type="password" id="password" class="form-control form-control-custom" placeholder="Masukkan kata sandi" required>
                </div>

                <button type="submit" id="loginBtn" class="btn btn-yellow-custom w-100 justify-content-center py-2 mb-3">
                    <span>Masuk ke Akun</span>
                </button>
            </form>

            <!-- Quick Demo Credentials Box -->
            <div class="p-3 bg-light rounded-2 border border-1 border-dark mb-4">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <span class="small fw-bold text-dark">Akun Demo Cepat:</span>
                    <span class="badge bg-yellow text-dark border border-1 border-dark rounded-pill py-0 px-2" style="font-size: 0.65rem;">Auto-Fill</span>
                </div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-custom btn-sm flex-fill" onclick="fillCredentials('admin', 'admin123')">
                        Admin Demo
                    </button>
                    <button type="button" class="btn btn-outline-custom btn-sm flex-fill" onclick="fillCredentials('budi_santoso', 'customer123')">
                        Customer Demo
                    </button>
                </div>
            </div>

            <div class="text-center">
                <p class="small text-muted mb-0">
                    Belum memiliki akun? <a href="/register" class="fw-bold text-primary text-decoration-none">Daftar Sekarang &rarr;</a>
                </p>
                <div class="mt-3">
                    <a href="/" class="small text-muted text-decoration-none">&larr; Kembali ke Beranda</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/formatters.js"></script>
    <script src="/js/app.js"></script>
    <script>
        function fillCredentials(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<span>Memproses Masuk...</span>';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    showToast(data.message || 'Login berhasil!', 'success');
                    setTimeout(() => {
                        window.location.href = data.redirectUrl || '/';
                    }, 600);
                } else {
                    showToast(data.message || 'Username atau password salah.', 'danger');
                    btn.disabled = false;
                    btn.innerHTML = '<span>Masuk ke Akun</span>';
                }
            } catch (err) {
                showToast('Terjadi kesalahan jaringan.', 'danger');
                btn.disabled = false;
                btn.innerHTML = '<span>Masuk ke Akun</span>';
            }
        });
    </script>
</body>
</html>
