<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - MiaWoof Petshop</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card" style="max-width: 520px;">
            <!-- Brand Logo -->
            <div class="text-center mb-4">
                <a href="/" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-2">
                    <img src="/images/branding/logo.jpg" alt="MiaWoof Logo" width="48" height="48" class="rounded-2 border border-2 border-dark" onerror="this.src='/images/icons/paw.svg'">
                    <span class="font-brand fs-2 text-primary fw-bold">MiaWoof</span>
                </a>
                <h4 class="fw-bold text-dark mb-1">Registrasi Akun Customer</h4>
                <p class="text-muted small mb-0">Bergabunglah untuk memesan produk dan layanan salon anabul.</p>
            </div>

            <!-- Register Form -->
            <form id="registerForm">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label-custom">Username *</label>
                        <input type="text" id="regUsername" class="form-control form-control-custom" placeholder="huruf_kecil_123" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-custom">Nama Lengkap *</label>
                        <input type="text" id="regFullName" class="form-control form-control-custom" placeholder="Nama Anda" required>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label-custom">Email</label>
                        <input type="email" id="regEmail" class="form-control form-control-custom" placeholder="email@contoh.com">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-custom">No. WhatsApp / HP</label>
                        <input type="tel" id="regPhone" class="form-control form-control-custom" placeholder="08123456789">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label-custom">Alamat Domisili</label>
                    <textarea id="regAddress" class="form-control form-control-custom" rows="2" placeholder="Alamat rumah pengiriman"></textarea>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label-custom">Password *</label>
                        <input type="password" id="regPassword" class="form-control form-control-custom" placeholder="Min. 6 karakter" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label-custom">Konfirmasi Password *</label>
                        <input type="password" id="regConfirmPassword" class="form-control form-control-custom" placeholder="Ulangi password" required>
                    </div>
                </div>

                <button type="submit" id="regBtn" class="btn btn-primary-custom w-100 justify-content-center py-2 mb-3">
                    <span>Daftar Sekarang</span>
                </button>
            </form>

            <div class="text-center">
                <p class="small text-muted mb-0">
                    Sudah memiliki akun? <a href="/login" class="fw-bold text-primary text-decoration-none">Masuk di sini &rarr;</a>
                </p>
                <div class="mt-3">
                    <a href="/" class="small text-muted text-decoration-none">&larr; Kembali ke Beranda</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/formatters.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            btn.disabled = true;
            btn.innerHTML = '<span>Mendaftarkan...</span>';

            const username = document.getElementById('regUsername').value.trim();
            const full_name = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const no_hp = document.getElementById('regPhone').value.trim();
            const alamat = document.getElementById('regAddress').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm_password = document.getElementById('regConfirmPassword').value;

            if (password !== confirm_password) {
                showToast('Konfirmasi kata sandi tidak cocok!', 'danger');
                btn.disabled = false;
                btn.innerHTML = '<span>Daftar Sekarang</span>';
                return;
            }

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, full_name, email, no_hp, alamat, password, confirm_password })
                });
                const data = await res.json();

                if (data.success) {
                    showToast(data.message || 'Pendaftaran berhasil! Mengalihkan ke login...', 'success');
                    setTimeout(() => {
                        window.location.href = '/login?msg=Pendaftaran+berhasil!+Silakan+masuk&status=success';
                    }, 800);
                } else {
                    showToast(data.message || 'Gagal mendaftar.', 'danger');
                    btn.disabled = false;
                    btn.innerHTML = '<span>Daftar Sekarang</span>';
                }
            } catch (err) {
                showToast('Terjadi kesalahan jaringan.', 'danger');
                btn.disabled = false;
                btn.innerHTML = '<span>Daftar Sekarang</span>';
            }
        });
    </script>
</body>
</html>
