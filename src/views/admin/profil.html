<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Admin - MiaWoof</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div class="app-wrapper">
        <div id="sidebar-root"></div>

        <main class="admin-main-content">
            <header class="admin-topbar">
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-yellow-custom btn-sm d-lg-none p-2 border-2 border-dark" onclick="toggleAdminSidebar()" title="Buka Menu">
                        <img src="/images/icons/paw.svg" alt="Menu" width="16" height="16">
                    </button>
                    <div>
                        <h5 class="fw-bold text-white mb-0">Pengaturan Akun Administrator</h5>
                        <small class="text-light opacity-90">Kelola nama, kontak, dan kata sandi akses administrator.</small>
                    </div>
                </div>
            </header>

            <div class="admin-content-body">
                <div class="card-modern p-4 mx-auto" style="max-width: 750px;">
                    <form id="adminProfForm">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom border-2 border-dark">
                            <div class="bg-yellow text-dark rounded-circle d-flex align-items-center justify-content-center fw-bold fs-3 border border-2 border-dark" style="width: 60px; height: 60px; box-shadow: 3px 3px 0px #000000;" id="adminAvatarInitial">
                                A
                            </div>
                            <div>
                                <h5 class="fw-bold text-dark mb-1" id="adminHeaderName">Administrator</h5>
                                <span class="badge bg-primary text-white border border-1 border-dark px-3 py-1 fw-bold">Super Admin MiaWoof</span>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label-custom">Username</label>
                                <input type="text" id="adminUsername" class="form-control form-control-custom bg-light" disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label-custom">Nama Lengkap *</label>
                                <input type="text" id="adminFullName" class="form-control form-control-custom" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label-custom">Email</label>
                                <input type="email" id="adminEmail" class="form-control form-control-custom">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label-custom">No. Handphone / WhatsApp</label>
                                <input type="tel" id="adminPhone" class="form-control form-control-custom">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label-custom">Alamat Kantor / Toko</label>
                            <textarea id="adminAddress" class="form-control form-control-custom" rows="2"></textarea>
                        </div>

                        <div class="border-top border-2 border-dark pt-3 mb-4">
                            <h6 class="fw-bold text-dark mb-3">Ganti Kata Sandi Administrator</h6>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label-custom">Password Baru</label>
                                    <input type="password" id="adminPassword" class="form-control form-control-custom" placeholder="Kosongkan jika tidak ingin diubah">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label-custom">Konfirmasi Password Baru</label>
                                    <input type="password" id="adminConfirmPassword" class="form-control form-control-custom" placeholder="Ulangi password baru">
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button type="submit" id="saveAdminProfBtn" class="btn btn-primary-custom px-4 py-2">
                                <span>Simpan Perubahan Profil</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/formatters.js"></script>
    <script src="/js/components/sidebar.js"></script>
    <script src="/js/app.js"></script>
    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const sessionRes = await fetch('/api/auth/session');
                const sessionData = await sessionRes.json();
                if (sessionData.authenticated && sessionData.user.role === 'admin') {
                    currentUser = sessionData.user;
                    initSidebar('profil', currentUser);
                    populateForm(currentUser);
                } else {
                    window.location.href = '/login';
                }
            } catch (e) {
                window.location.href = '/login';
            }

            document.getElementById('adminProfForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('saveAdminProfBtn');
                btn.disabled = true;
                btn.innerHTML = '<span>Menyimpan...</span>';

                const full_name = document.getElementById('adminFullName').value.trim();
                const email = document.getElementById('adminEmail').value.trim();
                const no_hp = document.getElementById('adminPhone').value.trim();
                const alamat = document.getElementById('adminAddress').value.trim();
                const password = document.getElementById('adminPassword').value;
                const confirm_password = document.getElementById('adminConfirmPassword').value;

                if (password && password !== confirm_password) {
                    showToast('Konfirmasi password baru tidak cocok!', 'danger');
                    btn.disabled = false;
                    btn.innerHTML = '<span>Simpan Perubahan Profil</span>';
                    return;
                }

                try {
                    const res = await fetch('/api/auth/profile', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ full_name, email, no_hp, alamat, password, confirm_password })
                    });
                    const data = await res.json();

                    if (data.success) {
                        showToast(data.message, 'success');
                        document.getElementById('adminPassword').value = '';
                        document.getElementById('adminConfirmPassword').value = '';
                        populateForm(data.user);
                    } else {
                        showToast(data.message || 'Gagal memperbarui profil.', 'danger');
                    }
                } catch (err) {
                    showToast('Terjadi kesalahan jaringan.', 'danger');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<span>Simpan Perubahan Profil</span>';
                }
            });
        });

        function populateForm(user) {
            document.getElementById('adminUsername').value = user.username || '';
            document.getElementById('adminFullName').value = user.full_name || '';
            document.getElementById('adminEmail').value = user.email || '';
            document.getElementById('adminPhone').value = user.no_hp || '';
            document.getElementById('adminAddress').value = user.alamat || '';
            
            document.getElementById('adminAvatarInitial').innerText = (user.full_name || 'A').charAt(0).toUpperCase();
            document.getElementById('adminHeaderName').innerText = user.full_name || 'Administrator';
        }
    </script>
</body>
</html>
