<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Produk - Admin MiaWoof</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div class="app-wrapper">
        <div id="sidebar-root"></div>

        <main class="admin-main-content">
            <header class="admin-topbar">
                <div>
                    <h5 class="fw-bold text-dark mb-0">Manajemen Produk & Stok</h5>
                    <small class="text-muted">Tambah, perbarui, dan kontrol inventori produk petshop.</small>
                </div>
                <div>
                    <button class="btn btn-primary-custom btn-sm" onclick="openAddModal()">
                        <img src="/images/icons/plus-white.svg" alt="Tambah" width="14" height="14">
                        <span>Tambah Produk Baru</span>
                    </button>
                </div>
            </header>

            <div class="admin-content-body">
                <!-- Search & Filters -->
                <div class="card-modern p-3 mb-4">
                    <div class="row g-3 align-items-center">
                        <div class="col-md-5">
                            <div class="input-group">
                                <input type="text" id="adminSearchInput" class="form-control form-control-custom" placeholder="Cari nama produk...">
                                <button class="btn btn-primary-custom px-3" id="adminSearchBtn">
                                    <img src="/images/icons/search-white.svg" alt="Cari" width="16" height="16">
                                </button>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <select id="adminCatFilter" class="form-select form-select-custom">
                                <option value="">Semua Kategori Hewan</option>
                                <option value="kucing">Khusus Kucing</option>
                                <option value="anjing">Khusus Anjing</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Products Table -->
                <div class="table-custom-container">
                    <div class="table-responsive">
                        <table class="table table-custom">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Gambar</th>
                                    <th>Nama Produk</th>
                                    <th>Kategori</th>
                                    <th>Stok</th>
                                    <th>Harga</th>
                                    <th>Kedaluwarsa</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="adminProductsTable">
                                <tr><td colspan="8" class="text-center py-5 text-muted">Memuat data produk...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border border-2 border-dark shadow-lg rounded-3 overflow-hidden">
                <div class="modal-header bg-primary text-white p-3 border-bottom border-2 border-dark">
                    <h5 class="modal-title fw-bold" id="productModalTitle">Tambah Produk Baru</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="productForm">
                        <input type="hidden" id="editProductId">

                        <div class="mb-3">
                            <label class="form-label-custom">Nama Produk *</label>
                            <input type="text" id="prodNama" class="form-control form-control-custom" placeholder="Contoh: Whiskas Adult 1.2kg" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label-custom">Kategori Hewan *</label>
                                <select id="prodKategori" class="form-select form-select-custom" required>
                                    <option value="kucing">Kucing</option>
                                    <option value="anjing">Anjing</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label-custom">Stok Awal *</label>
                                <input type="number" id="prodStock" class="form-control form-control-custom" min="0" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label-custom">Harga Jual (Rp) *</label>
                                <input type="number" id="prodHarga" class="form-control form-control-custom" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label-custom">Tanggal Expired</label>
                                <input type="date" id="prodExpired" class="form-control form-control-custom">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label-custom">Unggah Foto Produk (JPG/PNG/WEBP)</label>
                            <input type="file" id="prodImage" class="form-control form-control-custom" accept="image/jpeg,image/png,image/webp">
                        </div>

                        <button type="submit" id="saveProductBtn" class="btn btn-primary-custom w-100 justify-content-center py-2">
                            <span>Simpan Produk</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/formatters.js"></script>
    <script src="/js/components/sidebar.js"></script>
    <script src="/js/app.js"></script>
    <script>
        let productModal = null;
        let isEditMode = false;

        document.addEventListener('DOMContentLoaded', async () => {
            productModal = new bootstrap.Modal(document.getElementById('productModal'));

            // Check Session
            let user = null;
            try {
                const sessionRes = await fetch('/api/auth/session');
                const sessionData = await sessionRes.json();
                if (sessionData.authenticated && sessionData.user.role === 'admin') {
                    user = sessionData.user;
                } else {
                    window.location.href = '/login';
                    return;
                }
            } catch (e) {
                window.location.href = '/login';
                return;
            }

            initSidebar('produk', user);
            loadAdminProducts();

            // Filter Event
            document.getElementById('adminCatFilter').addEventListener('change', (e) => {
                loadAdminProducts(e.target.value, document.getElementById('adminSearchInput').value);
            });

            document.getElementById('adminSearchBtn').addEventListener('click', () => {
                loadAdminProducts(document.getElementById('adminCatFilter').value, document.getElementById('adminSearchInput').value);
            });

            // Form Submit Event
            document.getElementById('productForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('saveProductBtn');
                btn.disabled = true;
                btn.innerHTML = '<span>Menyimpan...</span>';

                const formData = new FormData();
                formData.append('nama', document.getElementById('prodNama').value);
                formData.append('kategori', document.getElementById('prodKategori').value);
                formData.append('stock', document.getElementById('prodStock').value);
                formData.append('harga', document.getElementById('prodHarga').value);
                formData.append('tgl_expired', document.getElementById('prodExpired').value);

                const fileInput = document.getElementById('prodImage');
                if (fileInput.files.length > 0) {
                    formData.append('gambar', fileInput.files[0]);
                }

                const editId = document.getElementById('editProductId').value;
                const endpoint = isEditMode ? `/api/products/${editId}` : '/api/products';

                try {
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        body: formData
                    });
                    const result = await res.json();

                    if (result.success) {
                        productModal.hide();
                        showToast(result.message, 'success');
                        loadAdminProducts();
                    } else {
                        showToast(result.message || 'Gagal menyimpan produk.', 'danger');
                    }
                } catch (err) {
                    showToast('Terjadi kesalahan jaringan.', 'danger');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<span>Simpan Produk</span>';
                }
            });
        });

        async function loadAdminProducts(kategori = null, search = null) {
            const tbody = document.getElementById('adminProductsTable');
            try {
                let url = '/api/products?';
                if (kategori) url += `kategori=${kategori}&`;
                if (search) url += `search=${encodeURIComponent(search)}&`;

                const res = await fetch(url);
                const data = await res.json();

                if (data.success && data.data.length > 0) {
                    tbody.innerHTML = data.data.map(p => `
                        <tr>
                            <td class="fw-bold">#${p.id_produk}</td>
                            <td>
                                <img src="/uploads/${p.gambar || 'default_product.png'}" alt="${p.nama}" style="width: 48px; height: 48px; object-fit: contain; border-radius: 6px; background: #fafafa; border: 1px solid var(--border-dark);" onerror="this.src='/images/placeholders/default_product.png'">
                            </td>
                            <td class="fw-bold text-dark">${p.nama}</td>
                            <td>
                                <span class="${p.kategori === 'kucing' ? 'badge-pet-cat' : 'badge-pet-dog'} text-capitalize">
                                    ${p.kategori}
                                </span>
                            </td>
                            <td class="fw-bold ${p.stock <= 5 ? 'text-danger' : 'text-dark'}">${p.stock}</td>
                            <td class="fw-bold text-primary">${formatRupiah(p.harga)}</td>
                            <td class="text-muted small">${p.tgl_expired || '-'}</td>
                            <td>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-sm btn-outline-custom p-1 px-2" onclick='openEditModal(${JSON.stringify(p)})' title="Edit">
                                        <img src="/images/icons/edit.svg" alt="Edit" width="14" height="14">
                                    </button>
                                    <button class="btn btn-sm btn-danger-custom p-1 px-2" onclick="deleteProduct(${p.id_produk})" title="Hapus">
                                        <img src="/images/icons/trash.svg" alt="Hapus" width="14" height="14">
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-muted">Belum ada data produk.</td></tr>';
                }
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-danger">Gagal memuat data produk.</td></tr>';
            }
        }

        function openAddModal() {
            isEditMode = false;
            document.getElementById('productForm').reset();
            document.getElementById('editProductId').value = '';
            document.getElementById('productModalTitle').innerText = 'Tambah Produk Baru';
            productModal.show();
        }

        function openEditModal(p) {
            isEditMode = true;
            document.getElementById('editProductId').value = p.id_produk;
            document.getElementById('prodNama').value = p.nama;
            document.getElementById('prodKategori').value = p.kategori;
            document.getElementById('prodStock').value = p.stock;
            document.getElementById('prodHarga').value = p.harga;
            document.getElementById('prodExpired').value = p.tgl_expired || '';
            document.getElementById('productModalTitle').innerText = `Edit Produk #${p.id_produk}`;
            productModal.show();
        }

        async function deleteProduct(id) {
            if (!confirm('Apakah Anda yakin ingin menghapus produk ini? Tindakan ini tidak dapat dibatalkan.')) return;

            try {
                const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    showToast(data.message, 'success');
                    loadAdminProducts();
                } else {
                    showToast(data.message || 'Gagal menghapus produk.', 'danger');
                }
            } catch (err) {
                showToast('Terjadi kesalahan jaringan.', 'danger');
            }
        }
    </script>
</body>
</html>
