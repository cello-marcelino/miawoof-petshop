<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pengguna - Admin MiaWoof</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div class="app-wrapper">
        <div id="sidebar-root"></div>

        <main class="admin-main-content">
            <header class="admin-topbar">
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-yellow-custom btn-sm d-lg-none p-2 border-2 border-dark" onclick="toggleAdminSidebar()" title="Buka Menu">
                        <img src="/images/icons/paw.svg" alt="Menu" width="16" height="16">
                    </button>
                    <div>
                        <h5 class="fw-bold text-white mb-0">Manajemen Pengguna Terdaftar</h5>
                        <small class="text-light opacity-90">Daftar akun pelanggan dan administrator pada sistem MiaWoof Petshop.</small>
                    </div>
                </div>
            </header>

            <div class="admin-content-body">
                <!-- Search & Counter Toolbar -->
                <div class="card-modern p-3 mb-4">
                    <div class="row g-3 align-items-center justify-content-between">
                        <div class="col-lg-6 col-md-8">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-2 border-dark border-end-0">
                                    <img src="/images/icons/search.svg" alt="Search" width="16" height="16">
                                </span>
                                <input type="text" id="userSearchInput" class="form-control form-control-custom border-start-0" placeholder="Cari nama, username, no hp, atau email...">
                            </div>
                        </div>
                        <div class="col-lg-4 col-md-4 text-md-end">
                            <span class="badge bg-light text-dark border border-1 border-dark px-3 py-2 fw-bold" id="totalUserCounter">
                                Total: 0 Pengguna
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Users Table Container -->
                <div class="table-custom-container">
                    <div class="table-responsive">
                        <table class="table table-custom">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nama Lengkap</th>
                                    <th>Username</th>
                                    <th>Role Akses</th>
                                    <th>Email</th>
                                    <th>No. Handphone</th>
                                    <th>Alamat Pelanggan</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="adminUsersTable">
                                <tr><td colspan="8" class="text-center py-5 text-muted">Memuat data pengguna...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/formatters.js"></script>
    <script src="/js/components/sidebar.js"></script>
    <script src="/js/app.js"></script>
    <script>
        let allUsers = [];

        document.addEventListener('DOMContentLoaded', async () => {
            // Check Session
            let user = null;
            try {
                const sessionRes = await fetch('/api/auth/session');
                const sessionData = await sessionRes.json();
                if (sessionData.authenticated && sessionData.user.role === 'admin') {
                    user = sessionData.user;
                } else {
                    window.location.href = '/login';
                    return;
                }
            } catch (e) {
                window.location.href = '/login';
                return;
            }

            initSidebar('users', user);
            loadAdminUsers();

            document.getElementById('userSearchInput').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().trim();
                if (!term) {
                    renderUsersTable(allUsers);
                    return;
                }
                const filtered = allUsers.filter(u => 
                    (u.full_name && u.full_name.toLowerCase().includes(term)) ||
                    (u.username && u.username.toLowerCase().includes(term)) ||
                    (u.email && u.email.toLowerCase().includes(term)) ||
                    (u.no_hp && u.no_hp.toLowerCase().includes(term)) ||
                    (u.alamat && u.alamat.toLowerCase().includes(term))
                );
                renderUsersTable(filtered);
            });
        });

        async function loadAdminUsers() {
            const tbody = document.getElementById('adminUsersTable');
            tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-muted">Memuat data pengguna...</td></tr>';

            try {
                const res = await fetch('/api/users');
                const data = await res.json();

                if (data.success && data.data.length > 0) {
                    allUsers = data.data;
                    document.getElementById('totalUserCounter').innerText = `Total: ${allUsers.length} Pengguna`;
                    renderUsersTable(allUsers);
                } else {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-muted">Belum ada data customer.</td></tr>';
                }
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-danger">Gagal memuat data pengguna.</td></tr>';
            }
        }

        function renderUsersTable(users) {
            const tbody = document.getElementById('adminUsersTable');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-muted">Tidak ada pengguna yang cocok dengan pencarian.</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(u => `
                <tr>
                    <td class="fw-bold text-dark">#${u.id}</td>
                    <td>
                        <div class="fw-bold text-dark">${u.full_name}</div>
                    </td>
                    <td>
                        <span class="badge bg-light text-dark border border-1 border-dark font-monospace">${u.username}</span>
                    </td>
                    <td>
                        <span class="badge ${u.role === 'admin' ? 'bg-danger text-white' : 'bg-primary text-white'} border border-1 border-dark px-2 py-1 text-uppercase" style="font-size: 0.7rem;">
                            ${u.role}
                        </span>
                    </td>
                    <td class="small">${u.email || '-'}</td>
                    <td class="small fw-semibold text-dark">${u.no_hp || '-'}</td>
                    <td class="text-muted small" style="max-width: 220px;">${u.alamat || '-'}</td>
                    <td>
                        <div class="btn-action-group">
                            ${u.role !== 'admin' ? `
                                <button class="btn-table-action btn-action-danger" onclick="deleteUser(${u.id})" title="Hapus Akun Pengguna">
                                    <span>Hapus</span>
                                </button>
                            ` : '<span class="badge bg-light text-muted border border-1 border-dark small">Protected</span>'}
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteUser(id) {
            if (!confirm('Hapus pengguna ini? Tindakan ini akan menghapus akun dan data riwayat yang bersangkutan.')) return;
            try {
                const res = await fetch(`/api/users/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    showToast(data.message, 'success');
                    loadAdminUsers();
                } else {
                    showToast(data.message || 'Gagal menghapus pengguna.', 'danger');
                }
            } catch (err) {
                showToast('Terjadi kesalahan jaringan.', 'danger');
            }
        }
    </script>
</body>
</html>
