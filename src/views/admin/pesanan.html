<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Pesanan - Admin MiaWoof</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div class="app-wrapper">
        <div id="sidebar-root"></div>

        <main class="admin-main-content">
            <header class="admin-topbar">
                <div>
                    <h5 class="fw-bold text-dark mb-0">Kelola Pesanan Pelanggan 🛒</h5>
                    <small class="text-muted">Pantau transaksi dan perbarui status proses pengiriman belanja.</small>
                </div>
            </header>

            <div class="admin-content-body">
                <!-- Orders Table Container -->
                <div class="table-custom-container">
                    <div class="table-responsive">
                        <table class="table table-custom">
                            <thead>
                                <tr>
                                    <th>No. Order</th>
                                    <th>Pelanggan</th>
                                    <th>Kontak / Alamat</th>
                                    <th>Detail Produk</th>
                                    <th>Total Bayar</th>
                                    <th>Tanggal</th>
                                    <th>Status Saat Ini</th>
                                    <th>Ubah Status</th>
                                </tr>
                            </thead>
                            <tbody id="adminOrdersTable">
                                <tr><td colspan="8" class="text-center py-5 text-muted">Memuat daftar pesanan...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/components/sidebar.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Check Session
            let user = null;
            try {
                const sessionRes = await fetch('/api/auth/session');
                const sessionData = await sessionRes.json();
                if (sessionData.authenticated && sessionData.user.role === 'admin') {
                    user = sessionData.user;
                } else {
                    window.location.href = '/login';
                    return;
                }
            } catch (e) {
                window.location.href = '/login';
                return;
            }

            initSidebar('pesanan', user);
            loadAdminOrders();
        });

        async function loadAdminOrders() {
            const tbody = document.getElementById('adminOrdersTable');
            try {
                const res = await fetch('/api/orders');
                const data = await res.json();

                if (data.success && data.data.length > 0) {
                    tbody.innerHTML = data.data.map(o => {
                        let badgeClass = 'badge-status-pending';
                        if (o.status === 'selesai') badgeClass = 'badge-status-success';
                        else if (o.status === 'diproses') badgeClass = 'badge-status-info';
                        else if (o.status === 'dibatalkan') badgeClass = 'badge-status-danger';

                        return `
                            <tr>
                                <td class="fw-bold text-dark">#ORD-${o.id_pesanan}</td>
                                <td>
                                    <div class="fw-bold text-dark">${o.customer_name}</div>
                                    <div class="text-muted small">${o.email || '-'}</div>
                                </td>
                                <td>
                                    <div class="small fw-semibold text-dark">${o.no_hp || '-'}</div>
                                    <div class="text-muted small" style="max-width: 200px;">${o.alamat || '-'}</div>
                                </td>
                                <td>
                                    <div class="fw-semibold text-dark">${o.nama_produk}</div>
                                    <div class="text-muted small">Jumlah: ${o.jumlah} unit (${formatRupiah(o.harga)}/unit)</div>
                                </td>
                                <td class="fw-bold text-primary">${formatRupiah(o.total)}</td>
                                <td class="text-muted small">${formatTanggalIndo(o.tgl_pesanan)}</td>
                                <td>
                                    <span class="badge-status ${badgeClass} text-capitalize">
                                        ● ${o.status}
                                    </span>
                                </td>
                                <td>
                                    <select class="form-select form-select-sm" onchange="updateStatus(${o.id_pesanan}, this.value)" style="width: 170px;">
                                        <option value="menunggu pembayaran" ${o.status === 'menunggu pembayaran' ? 'selected' : ''}>Menunggu Pembayaran</option>
                                        <option value="diproses" ${o.status === 'diproses' ? 'selected' : ''}>Diproses</option>
                                        <option value="selesai" ${o.status === 'selesai' ? 'selected' : ''}>Selesai</option>
                                        <option value="dibatalkan" ${o.status === 'dibatalkan' ? 'selected' : ''}>Dibatalkan</option>
                                    </select>
                                </td>
                            </tr>
                        `;
                    }).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-muted">Belum ada pesanan masuk.</td></tr>';
                }
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-danger">Gagal memuat daftar pesanan.</td></tr>';
            }
        }

        async function updateStatus(id_pesanan, status) {
            try {
                const res = await fetch(`/api/orders/${id_pesanan}/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                const data = await res.json();

                if (data.success) {
                    showToast(data.message, 'success');
                    loadAdminOrders();
                } else {
                    showToast(data.message || 'Gagal mengubah status.', 'danger');
                }
            } catch (err) {
                showToast('Terjadi kesalahan jaringan.', 'danger');
            }
        }
    </script>
</body>
</html>
