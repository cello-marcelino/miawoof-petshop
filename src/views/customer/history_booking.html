<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Reservasi Grooming - MiaWoof Petshop</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div id="navbar-root"></div>

    <main class="customer-main pt-4">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <h3 class="fw-bold text-dark mb-1">Jadwal Booking Grooming Saya</h3>
                    <p class="text-muted small mb-0">Pantau status konfirmasi dan jadwal kedatangan salon anabul Anda.</p>
                </div>
                <a href="/grooming" class="btn btn-primary-custom btn-sm">
                    <img src="/images/icons/plus.svg" alt="Booking" width="14" height="14" style="filter: brightness(0) invert(1);">
                    <span>Booking Jadwal Baru</span>
                </a>
            </div>

            <!-- Bookings Table Container -->
            <div class="table-custom-container">
                <div class="table-responsive">
                    <table class="table table-custom">
                        <thead>
                            <tr>
                                <th>No. Booking</th>
                                <th>Paket Perawatan</th>
                                <th>Jenis Hewan</th>
                                <th>Tanggal Booking</th>
                                <th>Jam Kedatangan</th>
                                <th>Tarif</th>
                                <th>Status Konfirmasi</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="bookingsTableBody">
                            <tr>
                                <td colspan="8" class="text-center py-5 text-muted">Memuat jadwal reservasi...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-root"></div>

    <script src="/js/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/formatters.js"></script>
    <script src="/js/components/navbar.js"></script>
    <script src="/js/components/footer.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            let currentUser = null;
            try {
                const sessionRes = await fetch('/api/auth/session');
                const sessionData = await sessionRes.json();
                if (sessionData.authenticated) currentUser = sessionData.user;
            } catch (e) {}

            initNavbar('booking', currentUser);
            initFooter();
            loadMyBookings();
        });

        async function loadMyBookings() {
            const tbody = document.getElementById('bookingsTableBody');
            try {
                const res = await fetch('/api/bookings');
                const result = await res.json();

                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = result.data.map(b => {
                        let badgeClass = 'badge-status-pending';
                        if (b.status === 'dikonfirmasi' || b.status === 'selesai') badgeClass = 'badge-status-success';
                        else if (b.status === 'dibatalkan') badgeClass = 'badge-status-danger';

                        return `
                            <tr>
                                <td class="fw-bold text-dark">#BKG-${b.id_booking}</td>
                                <td>
                                    <div class="fw-bold text-dark">${b.nama_paket}</div>
                                    <div class="text-muted small" style="max-width: 250px;">${b.keterangan_grooming}</div>
                                </td>
                                <td>
                                    <span class="${b.jenis_hewan === 'kucing' ? 'badge-pet-cat' : 'badge-pet-dog'} text-capitalize">
                                        ${b.jenis_hewan === 'kucing' ? 'Kucing' : 'Anjing'}
                                    </span>
                                </td>
                                <td class="fw-semibold text-dark">${formatTanggalIndo(b.tgl_booking)}</td>
                                <td class="fw-bold text-primary">${b.waktu} WIB</td>
                                <td class="fw-bold text-dark">${formatRupiah(b.harga)}</td>
                                <td>
                                    <span class="badge-status ${badgeClass} text-capitalize">
                                        ● ${b.status}
                                    </span>
                                </td>
                                <td>
                                    ${b.status === 'menunggu konfirmasi' ? `
                                        <button class="btn btn-danger-custom btn-sm" onclick="cancelBooking(${b.id_booking})">
                                            Batalkan
                                        </button>
                                    ` : '-'}
                                </td>
                            </tr>
                        `;
                    }).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-muted">Anda belum memiliki jadwal booking grooming.</td></tr>';
                }
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-danger">Gagal memuat jadwal booking.</td></tr>';
            }
        }

        async function cancelBooking(id_booking) {
            if (!confirm('Apakah Anda yakin ingin membatalkan jadwal reservasi grooming ini?')) return;

            try {
                const res = await fetch(`/api/bookings/${id_booking}/cancel`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    showToast(data.message, 'success');
                    loadMyBookings();
                } else {
                    showToast(data.message || 'Gagal membatalkan booking.', 'danger');
                }
            } catch (err) {
                showToast('Terjadi kesalahan jaringan.', 'danger');
            }
        }
    </script>
</body>
</html>
