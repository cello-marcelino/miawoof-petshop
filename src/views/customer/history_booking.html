<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Reservasi Grooming - MiaWoof Petshop</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
    <div id="navbar-root"></div>

    <main class="customer-main pt-4">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold text-dark mb-1">Jadwal Booking Grooming Saya</h3>
                    <p class="text-muted small mb-0">Pantau status konfirmasi antrean, jam kedatangan salon, dan instruksi dari groomer MiaWoof.</p>
                </div>
                <a href="/grooming" class="btn btn-primary-custom btn-sm">
                    <img src="/images/icons/plus.svg" alt="Booking" width="14" height="14">
                    <span>Reservasi Jadwal Baru</span>
                </a>
            </div>

            <!-- Bookings Table Container -->
            <div class="table-custom-container">
                <div class="table-responsive">
                    <table class="table table-custom">
                        <thead>
                            <tr>
                                <th>No. Booking</th>
                                <th>Hewan Peliharaan</th>
                                <th>Paket Perawatan</th>
                                <th>Jadwal Kedatangan</th>
                                <th>Tarif Biaya</th>
                                <th>Status Konfirmasi</th>
                                <th>Keterangan Admin / Groomer</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="bookingsTableBody">
                            <tr>
                                <td colspan="8" class="text-center py-5 text-muted">Memuat jadwal reservasi...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-root"></div>

    <script src="/js/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/utils/formatters.js"></script>
    <script src="/js/components/navbar.js"></script>
    <script src="/js/components/footer.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            let currentUser = null;
            try {
                const sessionRes = await fetch('/api/auth/session');
                const sessionData = await sessionRes.json();
                if (sessionData.authenticated) currentUser = sessionData.user;
            } catch (e) {}

            initNavbar('booking', currentUser);
            initFooter();
            loadMyBookings();
        });

        async function loadMyBookings() {
            const tbody = document.getElementById('bookingsTableBody');
            try {
                const res = await fetch('/api/bookings');
                const result = await res.json();

                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = result.data.map(b => {
                        let statusBadge = '';
                        if (b.status === 'dikonfirmasi') {
                            statusBadge = '<span class="badge bg-primary text-white border border-1 border-dark px-2 py-1 fw-bold">📅 Dikonfirmasi / Siap</span>';
                        } else if (b.status === 'selesai') {
                            statusBadge = '<span class="badge bg-success text-white border border-1 border-dark px-2 py-1 fw-bold">✅ Selesai Perawatan</span>';
                        } else if (b.status === 'dibatalkan') {
                            statusBadge = '<span class="badge bg-secondary text-white border border-1 border-dark px-2 py-1 fw-bold">❌ Dibatalkan</span>';
                        } else {
                            statusBadge = '<span class="badge bg-warning text-dark border border-1 border-dark px-2 py-1 fw-bold">⏳ Menunggu Konfirmasi</span>';
                        }

                        const speciesBadge = b.jenis_hewan === 'kucing' 
                            ? '<span class="badge-pet-cat text-capitalize" style="font-size: 0.7rem;">Kucing</span>'
                            : '<span class="badge-pet-dog text-capitalize" style="font-size: 0.7rem;">Anjing</span>';

                        const isPending = b.status === 'menunggu_konfirmasi' || b.status === 'menunggu konfirmasi';

                        return `
                            <tr>
                                <td class="fw-bold text-dark">#BKG-${b.id_booking}</td>
                                <td>
                                    <div class="fw-bold text-dark">🐾 ${b.nama_hewan || 'Anabul'}</div>
                                    <div class="mt-1">${speciesBadge}</div>
                                </td>
                                <td>
                                    <div class="fw-bold text-dark">${b.nama_paket}</div>
                                    <div class="text-muted small" style="max-width: 220px;">${b.keterangan_grooming || '-'}</div>
                                </td>
                                <td>
                                    <div class="fw-bold text-dark">${formatTanggalIndo(b.tgl_booking)}</div>
                                    <div class="fw-bold text-blue small">Pukul ${b.waktu} WIB</div>
                                </td>
                                <td class="fw-bold text-dark">${formatRupiah(b.harga)}</td>
                                <td>${statusBadge}</td>
                                <td style="max-width: 200px;">
                                    ${b.catatan_admin ? `<div class="p-2 bg-yellow-light border border-1 border-dark rounded-1 small fw-bold text-dark">📢 Groomer: ${b.catatan_admin}</div>` : '<span class="text-muted small">Belum ada catatan</span>'}
                                </td>
                                <td>
                                    ${isPending ? `
                                        <button class="btn btn-danger-custom btn-sm py-1 px-2" onclick="cancelBooking(${b.id_booking})">
                                            Batalkan
                                        </button>
                                    ` : '<span class="text-muted small">-</span>'}
                                </td>
                            </tr>
                        `;
                    }).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-muted">Anda belum memiliki jadwal reservasi grooming.</td></tr>';
                }
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-danger">Gagal memuat jadwal booking.</td></tr>';
            }
        }

        async function cancelBooking(id_booking) {
            if (!confirm('Apakah Anda yakin ingin membatalkan jadwal reservasi grooming ini?')) return;

            try {
                const res = await fetch(`/api/bookings/${id_booking}/cancel`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    showToast(data.message, 'success');
                    loadMyBookings();
                } else {
                    showToast(data.message || 'Gagal membatalkan booking.', 'danger');
                }
            } catch (err) {
                showToast('Terjadi kesalahan jaringan.', 'danger');
            }
        }
    </script>
</body>
</html>
